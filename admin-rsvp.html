<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>참석 여부 관리 · 형원 ♥ 지수</title>
  <meta name="robots" content="noindex">
  <meta name="googlebot" content="noindex">

  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <!-- 폰트: Pretendard(본문) + Gmarket Sans(제목) -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
  <!-- 관리자 로그인 게이트 (admin.html 과 동일 — Firebase 인증 전까지 화면 가림) -->
  <div class="admin-gate" id="admin-gate">
    <form class="admin-login" id="admin-login-form">
      <h1>참석 여부 관리</h1>
      <input type="email" id="admin-email" placeholder="관리자 이메일" autocomplete="username" required>
      <input type="password" id="admin-pw" placeholder="비밀번호" autocomplete="current-password" required>
      <button type="submit">로그인</button>
      <p class="admin-err" id="admin-err"></p>
    </form>
  </div>

  <!-- 우측 상단: 다른 관리자 페이지로 이동 -->
  <nav class="admin-nav">
    <a href="admin.html">← 방명록 관리</a>
    <a href="admin-wreaths.html">모바일 화환 관리 →</a>
  </nav>

  <main class="paper wreath-admin">
    <section class="section">
      <h2 class="title">참석 여부 관리</h2>
      <p class="wa-lead">하객이 전달한 참석 의사 목록입니다.</p>
      <p class="wa-count" id="wa-count">불러오는 중…</p>
      <div class="wa-toolbar">
        <label class="wa-filter">
          구분 필터
          <select id="wa-filter-side">
            <option value="all">전체</option>
            <option value="groom">신랑측</option>
            <option value="bride">신부측</option>
          </select>
        </label>
      </div>
      <div class="wa-table-wrap">
        <table class="wa-table wa-table--rsvp">
          <thead>
            <tr>
              <th class="wa-sort" data-sort="name">이름<span class="wa-sort-ic"></span></th>
              <th class="wa-sort" data-sort="side">구분<span class="wa-sort-ic"></span></th>
              <th class="wa-sort" data-sort="count">인원<span class="wa-sort-ic"></span></th>
              <th class="wa-sort" data-sort="at">작성일<span class="wa-sort-ic"></span></th>
            </tr>
          </thead>
          <tbody id="wa-body">
            <tr class="wa-empty"><td colspan="4">불러오는 중…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module">
    // guestbook.js 를 먼저 import — 무가드 initializeApp 이 첫 초기화를 담당하고
    // rsvp.js 는 getApps() 가드로 재사용한다 (admin-wreaths.html 과 동일한 순서 규약).
    import { adminLogin, onAdmin } from "./assets/js/guestbook.js";
    import { subscribeRsvps, deleteRsvp } from "./assets/js/rsvp.js";

    const gate = document.getElementById("admin-gate");
    const form = document.getElementById("admin-login-form");
    const errEl = document.getElementById("admin-err");
    const bodyEl = document.getElementById("wa-body");
    const countEl = document.getElementById("wa-count");
    const filterSel = document.getElementById("wa-filter-side");
    let started = false;
    let allRsvps = [];       // Firestore 전체 목록(항상 최신순으로 들어옴)
    let sortKey = "at";      // 필터/정렬 안 건드리면 작성일 최신순 기본값
    let sortDir = "desc";
    let filterSide = "all";

    function esc(s) {
      return (s || "").replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function fmt(d) {
      if (!d) return "방금";
      return d.getFullYear() + "." + (d.getMonth() + 1) + "." + d.getDate();
    }
    function sideLabel(side) { return side === "groom" ? "신랑측" : side === "bride" ? "신부측" : "-"; }

    function sortValue(r, key) {
      if (key === "name") return r.name || "";
      if (key === "side") return sideLabel(r.side);
      if (key === "count") return r.count || 0;
      return r.at ? r.at.getTime() : 0; // at
    }

    function updateSortIndicators() {
      document.querySelectorAll(".wa-sort").forEach((th) => {
        const ic = th.querySelector(".wa-sort-ic");
        if (th.getAttribute("data-sort") === sortKey) {
          th.classList.add("active");
          ic.textContent = sortDir === "asc" ? "▲" : "▼";
        } else {
          th.classList.remove("active");
          ic.textContent = "";
        }
      });
    }

    function applyAndRender() {
      // 요약(총 건수/인원)은 필터와 무관하게 항상 전체 기준
      const totalGuests = allRsvps.reduce((sum, r) => sum + (r.count || 0), 0);
      const groomGuests = allRsvps.filter((r) => r.side === "groom").reduce((sum, r) => sum + (r.count || 0), 0);
      const brideGuests = allRsvps.filter((r) => r.side === "bride").reduce((sum, r) => sum + (r.count || 0), 0);
      countEl.textContent = "총 " + allRsvps.length + "건 · " + totalGuests + "명 (신랑측 " + groomGuests + "명 · 신부측 " + brideGuests + "명)";

      let list = filterSide === "all" ? allRsvps.slice() : allRsvps.filter((r) => r.side === filterSide);
      list.sort((a, b) => {
        const av = sortValue(a, sortKey), bv = sortValue(b, sortKey);
        const cmp = typeof av === "string" ? av.localeCompare(bv, "ko") : av - bv;
        return sortDir === "asc" ? cmp : -cmp;
      });

      if (!list.length) {
        bodyEl.innerHTML = '<tr class="wa-empty"><td colspan="4">' +
          (allRsvps.length ? "이 조건에 해당하는 참석 의사가 없어요" : "아직 전달된 참석 의사가 없어요") + "</td></tr>";
      } else {
        bodyEl.innerHTML = list.map((r) =>
          "<tr>" +
            '<td class="wa-who">' + esc(r.name) + "</td>" +
            '<td>' + sideLabel(r.side) + "</td>" +
            '<td>' + r.count + "명</td>" +
            '<td class="wa-when">' + fmt(r.at) +
              ' <button type="button" class="wa-del" data-del="' + r.id + '">삭제</button></td>' +
          "</tr>").join("");
      }
      updateSortIndicators();
    }

    document.querySelectorAll(".wa-sort").forEach((th) => {
      th.addEventListener("click", () => {
        const key = th.getAttribute("data-sort");
        if (sortKey === key) { sortDir = sortDir === "asc" ? "desc" : "asc"; }
        else { sortKey = key; sortDir = key === "at" ? "desc" : "asc"; }
        applyAndRender();
      });
    });

    filterSel.addEventListener("change", () => {
      filterSide = filterSel.value;
      applyAndRender();
    });

    // 삭제 → onSnapshot 이 자동으로 목록을 다시 그림(수동 갱신 불필요)
    bodyEl.addEventListener("click", (e) => {
      const btn = e.target.closest(".wa-del");
      if (!btn) return;
      const id = btn.getAttribute("data-del");
      const r = allRsvps.find((x) => x.id === id);
      if (!confirm("'" + ((r && r.name) || "하객") + "'님의 참석 의사를 삭제하시겠습니까?")) return;
      btn.disabled = true;
      deleteRsvp(id).catch((err) => {
        console.error(err);
        btn.disabled = false;
        alert("삭제에 실패했어요. (로그인/권한 확인)");
      });
    });

    onAdmin((user) => {
      if (user) {
        gate.hidden = true;
        if (!started) {
          started = true;
          subscribeRsvps((list) => { allRsvps = list; applyAndRender(); });
        }
      } else {
        gate.hidden = false;
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errEl.textContent = "";
      try {
        await adminLogin(document.getElementById("admin-email").value.trim(),
                         document.getElementById("admin-pw").value);
      } catch (err) {
        console.error(err);
        errEl.textContent = "로그인 실패: 이메일/비밀번호를 확인하세요.";
      }
    });
  </script>
</body>
</html>
